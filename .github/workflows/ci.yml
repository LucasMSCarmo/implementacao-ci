name: CI

# Gatilho: Pull Request para main/develop
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths-ignore: ['**.md', 'docs/**']

# Novo commit no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # 1 e 2 - Análise de formatação + análise estática de código
  qualidade:
    name: Formatação e análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Análise de formatação (Prettier)
        run: npm run format:check
      - name: Análise estática (ESLint + eslint-plugin-security)
        run: npm run lint
      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

  # 3 - Análise estática de segurança (SAST + dependências)
  seguranca:
    name: Análise estática de segurança
    needs: qualidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências de produção (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Análise CodeQL (SAST)
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  # 4 - Testes unitários
  testes-unitarios:
    name: Testes unitários
    needs: seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Testes unitários com cobertura
        run: npm run test:unit
      - name: Resumo da cobertura
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Métrica | % |\n|---|---|\n'+Object.entries(t).map(([k,v])=>'| '+k+' | '+v.pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/

  # 5 - Build
  build:
    name: Build
    needs: testes-unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Compilar TypeScript
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # 6 - Testes de integração (artefato do build + PostgreSQL real)
  testes-integracao:
    name: Testes de integração
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Aplicar migrações no banco
        run: npm run db:migrate
      - name: Testes de integração (API + PostgreSQL)
        run: npm run test:integration

  # 7 - Criação da imagem Docker
  imagem:
    name: Criação de imagem
    needs: testes-integracao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Definir nome da imagem (minúsculo)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
            ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste de fumaça da imagem
        run: |
          docker run -d --name api -p 3000:3000 -e DATABASE_URL=postgres://x:x@127.0.0.1:1/x \
            ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          sleep 3
          # sem banco a API deve subir e responder 503 no /health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)" = "503"
          docker rm -f api
      - name: Scan de vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Publicar imagem no GitHub Container Registry
        run: docker push --all-tags ${{ env.IMAGE }}
